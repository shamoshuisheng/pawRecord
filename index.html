<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PawTrail · Support</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='14' r='5.5' fill='%23ff9a3d'/><circle cx='7' cy='8' r='2.2' fill='%23ff9a3d'/><circle cx='17' cy='8' r='2.2' fill='%23ff9a3d'/><circle cx='5.5' cy='13.5' r='1.8' fill='%23ff9a3d'/><circle cx='18.5' cy='13.5' r='1.8' fill='%23ff9a3d'/></svg>">
<style>
  :root {
    --bg: #0c0c12;
    --surface: #14141c;
    --surface-2: #1c1c28;
    --border: #262636;
    --text: #ececf2;
    --muted: #9a9ab0;
    --accent: #ff9a3d;
    --accent-2: #5ec8e8;
    --accent-grad: linear-gradient(135deg, #ff9a3d 0%, #5ec8e8 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Noto Sans JP", "Noto Sans KR", "Helvetica Neue", sans-serif;
    line-height: 1.7;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  .lang-bar {
    display: flex; justify-content: flex-end; gap: 6px;
    padding: 20px 0 0;
    flex-wrap: wrap;
  }
  .lang-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .lang-btn:hover { border-color: var(--accent); color: var(--text); }
  .lang-btn.active {
    background: var(--accent-grad);
    color: #fff; border-color: transparent;
    font-weight: 600;
  }
  .hero {
    padding: 48px 0 40px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .logo-mark {
    width: 56px; height: 56px; margin: 0 auto 20px;
    border-radius: 14px;
    background: var(--accent-grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(255, 154, 61, 0.35);
  }
  .logo-mark svg { width: 34px; height: 34px; }
  .hero h1 {
    font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
    margin-bottom: 10px;
  }
  .hero p { color: var(--muted); font-size: 15px; max-width: 480px; margin: 0 auto; }
  .contact-bar {
    margin: 32px auto 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 22px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .contact-bar .label { color: var(--muted); font-size: 13px; }
  .contact-bar .email { font-weight: 600; font-size: 15px; }
  section { padding: 40px 0; border-bottom: 1px solid var(--border); }
  section:last-of-type { border-bottom: none; }
  h2 {
    font-size: 19px; font-weight: 700; margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  h2::before {
    content: ""; width: 4px; height: 18px; border-radius: 2px;
    background: var(--accent-grad);
  }
  .feat-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  .feat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .feat h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .feat p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .feat .icon {
    width: 28px; height: 28px; border-radius: 7px;
    background: var(--surface-2); margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .feat .icon svg { width: 16px; height: 16px; stroke: var(--accent); fill: none; stroke-width: 2; }
  .faq-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    background: var(--surface);
    overflow: hidden;
  }
  .faq-q {
    padding: 16px 18px;
    cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 14.5px;
    user-select: none;
  }
  .faq-q:hover { background: var(--surface-2); }
  .faq-q .arrow {
    transition: transform 0.2s;
    color: var(--muted); font-size: 12px;
    flex-shrink: 0; margin-left: 12px;
  }
  .faq-item.open .faq-q .arrow { transform: rotate(180deg); }
  .faq-a {
    max-height: 0; overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .faq-a-inner {
    padding: 0 18px 16px;
    color: var(--muted); font-size: 14px; line-height: 1.75;
  }
  .faq-item.open .faq-a { max-height: 600px; }
  .faq-a-inner strong { color: var(--text); font-weight: 600; }
  .faq-a-inner a { color: var(--accent-2); }
  .info-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
  }
  .info-block p { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .info-block p:last-child { margin-bottom: 0; }
  .info-block strong { color: var(--text); }
  footer {
    padding: 32px 0 48px;
    text-align: center;
    color: var(--muted); font-size: 12.5px;
  }
  footer .links { margin-bottom: 10px; }
  footer .links a { margin: 0 10px; }
  @media (max-width: 600px) {
    .hero { padding: 32px 0 28px; }
    .hero h1 { font-size: 22px; }
    .feat-grid { grid-template-columns: 1fr; }
    .contact-bar { flex-direction: column; align-items: flex-start; }
    h2 { font-size: 17px; }
    .lang-btn { padding: 4px 8px; font-size: 11.5px; }
  }
</style>
</head>

    { q: "Exporter le passeport PDF", a: "Ouvrez la fiche d'un animal → bouton <em>Plus</em> en haut à droite → <em>Exporter le passeport PDF</em>. Partagez via Mail, Messages ou Fichiers." },
    { q: "Pro acheté mais fonctionnalités verrouillées", a: "Allez dans <em>Moi → Abonnement → Restaurer les achats</em> avec le bon compte Apple. En cas de problème, envoyez votre reçu à " + EMAIL + "." },
    { q: "Demander un remboursement", a: "Tous les remboursements d'achats intégrés sont traités par Apple. <a href='https://reportaproblem.apple.com' target='_blank'>reportaproblem.apple.com</a>. Les développeurs n'ont pas de droit de remboursement. Voir <a href='" + URL_SUBSCRIPTION + "' target='_blank'>Contrat d'abonnement</a>." },
    { q: "Fiabilité des conseils par race ?", a: "Les conseils sont basés sur les lignes directrices publiques de l'AVMA (Association Médicale Vétérinaire Américaine). Ils servent de référence générale et <strong>ne remplacent pas un diagnostic vétérinaire professionnel</strong>." }
  ],
  subTitle: "Abonnement & accès",
  subLines: [
    "<strong>Gratuit :</strong> Jusqu'à 3 animaux, stockage local, carnets de base vaccins/médicaments/visites, score santé de base.",
    "<strong>Pro :</strong> Animaux illimités, sauvegarde iCloud chiffrée, verrouillage Face ID/Touch ID, statistiques avancées, export PDF, conseils par race, support prioritaire.",
    "<strong>Renouvellement automatique :</strong> Facturé 24 h avant la fin. Résiliable dans les réglages identifiant Apple.",
    "<strong>Politique de confidentialité :</strong> <a href='" + URL_PRIVACY + "' target='_blank'>Voir la politique complète</a>"
  ],
  privacy: "Confidentialité",
  terms: "Conditions d'utilisation",
  contactUs: "Contrat d'abonnement"
};

// ========== ICONS ==========
var ICONS = {
  needle: '<svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="4"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/></svg>',
  pill: '<svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="4"/><line x1="12" y1="8" x2="12" y2="16"/></svg>',
  chart: '<svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>',
  doc: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>'
};

// ========== RENDER ==========
var LANGS = ["zh-CN", "zh-TW", "en-US", "ja", "ko", "de-DE", "fr-FR"];
var currentLang = "zh-CN";
var langBarEl = document.getElementById("langBar");
var featGridEl = document.getElementById("featGrid");
var faqListEl = document.getElementById("faqList");
var subBlockEl = document.getElementById("subBlock");

LANGS.forEach(function (lang) {
  var item = I18N[lang];
  var btn = document.createElement("button");
  btn.className = "lang-btn";
  btn.textContent = item.langName;
  btn.dataset.lang = lang;
  btn.onclick = function () { setLang(lang); };
  langBarEl.appendChild(btn);
});

function renderFeats(list) {
  var html = "";
  list.forEach(function (f) {
    html += '<div class="feat">' +
      '<div class="icon">' + ICONS[f.icon] + '</div>' +
      '<h3>' + f.title + '</h3>' +
      '<p>' + f.desc + '</p>' +
      '</div>';
  });
  return html;
}

function renderFaqs(list) {
  var html = "";
  list.forEach(function (f) {
    html += '<div class="faq-item">' +
      '<div class="faq-q" onclick="this.parentElement.classList.toggle(\'open\')">' +
      '<span>' + f.q + '</span>' +
      '<span class="arrow">▼</span>' +
      '</div>' +
      '<div class="faq-a"><div class="faq-a-inner">' + f.a + '</div></div>' +
      '</div>';
  });
  return html;
}

function setLang(langKey) {
  currentLang = langKey;
  var t = I18N[langKey] || I18N["en-US"];
  document.documentElement.lang = langKey;
  document.title = t.heroTitle + " | PawTrail";

  document.querySelectorAll(".lang-btn").forEach(function (b) {
    b.classList.toggle("active", b.dataset.lang === langKey);
  });

  document.querySelector(".hero h1").textContent = t.heroTitle;
  document.querySelector(".hero p").innerHTML = t.heroDesc;
  document.querySelector(".contact-bar .label").textContent = t.contactLabel;
  document.querySelector(".contact-bar a").textContent = t.contactBtn;

  featGridEl.innerHTML = renderFeats(t.featureCards);
  faqListEl.innerHTML = renderFaqs(t.faqs);

  var subHtml = "";
  t.subLines.forEach(function (line) { subHtml += "<p>" + line + "</p>"; });
  subBlockEl.innerHTML = subHtml;

  var footerLinks = document.querySelectorAll("footer .links a");
  footerLinks[0].textContent = t.privacy;
  footerLinks[1].textContent = t.terms;
  footerLinks[2].textContent = t.contactUs;

  localStorage.setItem("support_lang", langKey);
}

function detectBrowserLang() {
  var nav = (navigator.language || navigator.userLanguage || "en").toLowerCase();
  if (nav.startsWith("zh")) {
    if (nav.indexOf("tw") !== -1 || nav.indexOf("hk") !== -1) return "zh-TW";
    return "zh-CN";
  }
  for (var i = 0; i < LANGS.length; i++) {
    var l = LANGS[i];
    if (nav.indexOf(l.toLowerCase()) === 0) return l;
  }
  return "en-US";
}

(function init() {
  var saved = localStorage.getItem("support_lang");
  var initLang = (saved && I18N[saved]) ? saved : detectBrowserLang();
  setLang(initLang);
})();
</script>
</body>
</html>
